<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaebf0" />
      <stop offset="35%" stop-color="#dedfe6" />
      <stop offset="70%" stop-color="#e3e1eb" />
      <stop offset="100%" stop-color="#e2dbe8" />
    </linearGradient>

    <!-- 3D Top-Left Planet (Purple/Blue Indigo) -->
    <radialGradient id="planetTL" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="30%" stop-color="#6366f1" />
      <stop offset="65%" stop-color="#3730a3" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </radialGradient>

    <!-- 3D Top-Right Planet (Magenta/Fuchsia) -->
    <radialGradient id="planetTR" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="35%" stop-color="#e11d48" />
      <stop offset="70%" stop-color="#9f1239" />
      <stop offset="100%" stop-color="#4c0519" />
    </radialGradient>

    <!-- 3D White Pearl Sphere -->
    <radialGradient id="sphereWhite" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="80%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </radialGradient>

    <!-- Small Orb Pink/Purple -->
    <radialGradient id="orbPink" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="60%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#831843" />
    </radialGradient>

    <!-- Small Orb Blue/Purple -->
    <radialGradient id="orbBlue" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="60%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </radialGradient>

    <!-- Glass Card Gradient Left -->
    <linearGradient id="glassCardLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.25" />
    </linearGradient>

    <!-- Glass Card Gradient Right -->
    <linearGradient id="glassCardRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.35" />
    </linearGradient>

    <!-- Icon Gradient Inside Left Card -->
    <linearGradient id="leftIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="ringGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.4" />
    </linearGradient>

    <!-- Filters -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>

    <filter id="glowGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="25" flood-color="#a855f7" flood-opacity="0.3" />
    </filter>

    <filter id="glowWhite" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ffffff" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1920" height="1080" fill="url(#bgCanvas)" />

  <!-- Light Ambient Glow Streaks -->
  <circle cx="200" cy="200" r="400" fill="#c084fc" opacity="0.15" filter="blur(80px)" />
  <circle cx="1700" cy="150" r="450" fill="#f472b6" opacity="0.15" filter="blur(90px)" />
  <circle cx="1600" cy="900" r="500" fill="#818cf8" opacity="0.2" filter="blur(100px)" />

  <!-- ==================== TOP-LEFT PLANET & ORBIT ==================== -->
  <g transform="translate(-40, -30)">
    <!-- Planet Shadow / Glow -->
    <circle cx="100" cy="120" r="150" fill="#4338ca" opacity="0.25" filter="blur(30px)" />
    
    <!-- Planet Sphere -->
    <circle cx="100" cy="120" r="140" fill="url(#planetTL)" />

    <!-- Orbit Ring Rear -->
    <path d="M -90 130 A 210 55 -18 0 1 290 90" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.6" />

    <!-- Small Orb on Ring -->
    <circle cx="230" cy="225" r="12" fill="url(#orbPink)" filter="url(#glowGlow)" />
  </g>

  <!-- ==================== LEFT GLASS CARD ==================== -->
  <g transform="translate(10, 320) rotate(-6)" filter="url(#softShadow)">
    <!-- Glass Box -->
    <rect width="280" height="210" rx="28" fill="url(#glassCardLeft)" />
    <rect width="280" height="210" rx="28" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8" />

    <!-- Card Icon Box -->
    <rect x="24" y="28" width="70" height="70" rx="20" fill="url(#leftIconGrad)" />
    <!-- Bot/Audio Logo symbol inside icon -->
    <path d="M 45 60 C 45 52, 73 52, 73 60 C 77 60, 79 64, 79 70 L 79 72 C 79 77, 73 80, 59 80 C 45 80, 39 77, 39 72 L 39 70 C 39 64, 41 60, 45 60 Z" fill="none" stroke="#ffffff" stroke-width="3" transform="translate(-10, -12)" />
    <circle cx="49" cy="53" r="3" fill="#ffffff" />
    <circle cx="59" cy="53" r="3" fill="#ffffff" />

    <!-- Text Lines -->
    <rect x="110" y="38" width="130" height="12" rx="6" fill="#64748b" opacity="0.25" />
    <rect x="110" y="60" width="90" height="10" rx="5" fill="#64748b" opacity="0.18" />
    <rect x="110" y="78" width="110" height="10" rx="5" fill="#64748b" opacity="0.18" />
  </g>

  <!-- Floating Pink Orb Left -->
  <circle cx="315" cy="700" r="18" fill="url(#orbPink)" filter="url(#softShadow)" />

  <!-- ==================== BOTTOM-LEFT PEARL SPHERE & RING ==================== -->
  <g transform="translate(-120, 680)">
    <!-- Large White Pearl Sphere -->
    <circle cx="220" cy="220" r="230" fill="url(#sphereWhite)" filter="url(#softShadow)" />

    <!-- Ring Around Giant Pearl -->
    <ellipse cx="220" cy="220" rx="310" ry="85" fill="none" stroke="url(#ringGrad)" stroke-width="4" transform="rotate(-18 220 220)" />

    <!-- Orbiting Orb on Ring -->
    <circle cx="295" cy="265" r="30" fill="url(#planetTL)" filter="url(#softShadow)" />
  </g>

  <!-- Small floating background dots left -->
  <circle cx="370" cy="620" r="5" fill="#ffffff" opacity="0.9" />
  <circle cx="490" cy="820" r="4" fill="#a855f7" opacity="0.5" />

  <!-- ==================== TOP-RIGHT MAGENTA PLANET ==================== -->
  <g transform="translate(1620, -100)">
    <circle cx="200" cy="150" r="190" fill="url(#planetTR)" filter="url(#softShadow)" />
  </g>

  <!-- ==================== TOP-RIGHT SPEECH BUBBLE & RING ==================== -->
  <g transform="translate(1420, 160)" filter="url(#softShadow)">
    <!-- Ring behind speech bubble -->
    <ellipse cx="60" cy="45" rx="190" ry="45" fill="none" stroke="url(#ringGrad2)" stroke-width="2.5" transform="rotate(-12 60 45)" />

    <!-- Floating Pearl Orb on Ring Left -->
    <circle cx="-120" cy="80" r="26" fill="url(#sphereWhite)" />

    <!-- White Speech Bubble Card -->
    <rect x="0" y="0" width="130" height="90" rx="28" fill="#ffffff" />
    <!-- Tail -->
    <path d="M 25 88 L 15 105 L 38 90 Z" fill="#ffffff" />

    <!-- Three Dots inside Speech Bubble -->
    <circle cx="42" cy="45" r="7" fill="#f43f5e" />
    <circle cx="65" cy="45" r="7" fill="#8b5cf6" />
    <circle cx="88" cy="45" r="7" fill="#3b82f6" />
  </g>

  <!-- Tiny floating dot top right -->
  <circle cx="1370" cy="220" r="4" fill="#ec4899" />

  <!-- ==================== MIDDLE-RIGHT PURPLE ORB ==================== -->
  <circle cx="1660" cy="550" r="40" fill="url(#orbBlue)" filter="url(#softShadow)" />

  <!-- ==================== BOTTOM-RIGHT GLASS CARD ==================== -->
  <g transform="translate(1600, 590) rotate(8)" filter="url(#softShadow)">
    <rect width="280" height="220" rx="28" fill="url(#glassCardRight)" />
    <rect width="280" height="220" rx="28" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6" />

    <!-- Icon box -->
    <rect x="24" y="28" width="75" height="75" rx="22" fill="#ffffff" fill-opacity="0.25" />
    
    <!-- Bot Head Vector -->
    <g transform="translate(38, 42)">
      <rect x="8" y="12" width="32" height="24" rx="8" fill="none" stroke="#ffffff" stroke-width="3" />
      <circle cx="18" cy="24" r="3" fill="#ffffff" />
      <circle cx="30" cy="24" r="3" fill="#ffffff" />
      <line x1="24" y1="4" x2="24" y2="12" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
      <circle cx="24" cy="3" r="2.5" fill="#ffffff" />
    </g>

    <!-- Placeholder lines -->
    <rect x="115" y="40" width="130" height="12" rx="6" fill="#ffffff" opacity="0.7" />
    <rect x="115" y="62" width="100" height="10" rx="5" fill="#ffffff" opacity="0.4" />
    <rect x="115" y="80" width="120" height="10" rx="5" fill="#ffffff" opacity="0.4" />
  </g>

  <!-- ==================== BOTTOM-RIGHT WAVE PARTICLE MESH ==================== -->
  <g opacity="0.85">
    <!-- Curved Wave Grid of Dots -->
    <!-- Row 1 -->
    <circle cx="1250" cy="1020" r="2.5" fill="#ffffff" opacity="0.4" />
    <circle cx="1280" cy="990" r="2.5" fill="#ffffff" opacity="0.5" />
    <circle cx="1310" cy="960" r="2.5" fill="#ffffff" opacity="0.6" />
    <circle cx="1340" cy="930" r="2.5" fill="#ffffff" opacity="0.7" />
    <circle cx="1370" cy="900" r="2.5" fill="#ffffff" opacity="0.8" />
    <circle cx="1400" cy="875" r="2.5" fill="#ffffff" opacity="0.9" />
    <circle cx="1430" cy="855" r="2.5" fill="#ffffff" opacity="0.9" />
    <circle cx="1460" cy="840" r="2.5" fill="#ffffff" opacity="0.8" />
    <circle cx="1490" cy="830" r="2.5" fill="#ffffff" opacity="0.7" />
    <circle cx="1520" cy="825" r="2.5" fill="#ffffff" opacity="0.6" />
    <circle cx="1550" cy="828" r="2.5" fill="#ffffff" opacity="0.5" />

    <!-- Row 2 -->
    <circle cx="1270" cy="1035" r="2" fill="#ffffff" opacity="0.3" />
    <circle cx="1300" cy="1005" r="2" fill="#ffffff" opacity="0.4" />
    <circle cx="1330" cy="975" r="2" fill="#ffffff" opacity="0.5" />
    <circle cx="1360" cy="945" r="2" fill="#ffffff" opacity="0.6" />
    <circle cx="1390" cy="918" r="2" fill="#ffffff" opacity="0.75" />
    <circle cx="1420" cy="893" r="2" fill="#ffffff" opacity="0.85" />
    <circle cx="1450" cy="873" r="2" fill="#ffffff" opacity="0.85" />
    <circle cx="1480" cy="858" r="2" fill="#ffffff" opacity="0.75" />
    <circle cx="1510" cy="848" r="2" fill="#ffffff" opacity="0.65" />
    <circle cx="1540" cy="843" r="2" fill="#ffffff" opacity="0.55" />

    <!-- Row 3 -->
    <circle cx="1290" cy="1050" r="2" fill="#ffffff" opacity="0.25" />
    <circle cx="1320" cy="1020" r="2" fill="#ffffff" opacity="0.35" />
    <circle cx="1350" cy="990" r="2" fill="#ffffff" opacity="0.45" />
    <circle cx="1380" cy="960" r="2" fill="#ffffff" opacity="0.55" />
    <circle cx="1410" cy="935" r="2" fill="#ffffff" opacity="0.7" />
    <circle cx="1440" cy="910" r="2" fill="#ffffff" opacity="0.8" />
    <circle cx="1470" cy="890" r="2" fill="#ffffff" opacity="0.8" />
    <circle cx="1500" cy="875" r="2" fill="#ffffff" opacity="0.7" />
    <circle cx="1530" cy="865" r="2" fill="#ffffff" opacity="0.6" />

    <!-- Row 4 -->
    <circle cx="1310" cy="1065" r="1.5" fill="#ffffff" opacity="0.2" />
    <circle cx="1340" cy="1035" r="1.5" fill="#ffffff" opacity="0.3" />
    <circle cx="1370" cy="1005" r="1.5" fill="#ffffff" opacity="0.4" />
    <circle cx="1400" cy="975" r="1.5" fill="#ffffff" opacity="0.5" />
    <circle cx="1430" cy="950" r="1.5" fill="#ffffff" opacity="0.6" />
    <circle cx="1460" cy="927" r="1.5" fill="#ffffff" opacity="0.7" />
    <circle cx="1490" cy="907" r="1.5" fill="#ffffff" opacity="0.7" />
    <circle cx="1520" cy="892" r="1.5" fill="#ffffff" opacity="0.6" />

    <!-- Wave Grid Dense Lines -->
    <path d="M 1240 1010 Q 1380 880 1560 830" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.35" stroke-dasharray="3,6" />
    <path d="M 1260 1025 Q 1400 895 1580 845" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3" stroke-dasharray="3,6" />
    <path d="M 1280 1040 Q 1420 910 1600 860" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.25" stroke-dasharray="3,6" />
    <path d="M 1300 1055 Q 1440 925 1620 875" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.2" stroke-dasharray="3,6" />
  </g>

  <!-- ==================== BOTTOM-RIGHT WHITE PEARL SPHERE & ORBIT ==================== -->
  <g transform="translate(1500, 840)">
    <!-- Ring -->
    <ellipse cx="170" cy="150" rx="210" ry="55" fill="none" stroke="url(#ringGrad)" stroke-width="3" transform="rotate(-22 170 150)" />
    
    <!-- White Pearl Sphere -->
    <circle cx="170" cy="150" r="115" fill="url(#sphereWhite)" filter="url(#softShadow)" />

    <!-- Orbiting Blue Sphere -->
    <circle cx="45" cy="180" r="16" fill="url(#orbBlue)" />

    <!-- Star Flare Spot -->
    <g transform="translate(300, 80)" opacity="0.9">
      <line x1="-15" y1="0" x2="15" y2="0" stroke="#ffffff" stroke-width="2.5" />
      <line x1="0" y1="-15" x2="0" y2="15" stroke="#ffffff" stroke-width="2.5" />
      <circle cx="0" cy="0" r="4" fill="#ffffff" />
    </g>
  </g>

</svg>
